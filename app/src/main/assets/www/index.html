<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>Loopa — Live & HD Wallpapers</title>
<meta name="description" content="Premium live video and HD photo wallpapers for your phone.">
<meta property="og:title" content="Loopa — Live & HD Wallpapers">
<meta property="og:description" content="Premium live video and HD photo wallpapers for your phone.">
<meta property="og:type" content="website">
<link rel="icon" href="thumbnails/glass.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<div id="splash" class="splash"><div class="logo">loop<span>a</span></div><div class="loader"></div></div>

<div class="wrap">
  <header class="top-bar">
    <div>
      <p class="hello">Good to see you</p>
      <h1 class="brand">loop<span>a</span></h1>
    </div>
    <div class="stat"><b id="statCount">0</b><span>wallpapers</span></div>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search neon, nature, cars…" autocomplete="off">
    <button id="clearQ" class="clear" hidden aria-label="Clear">&#10005;</button>
  </div>

  <div class="seg" id="types">
    <button data-type="all" class="on">All</button>
    <button data-type="live"><i class="dot"></i>Live</button>
    <button data-type="photo">Photos</button>
  </div>
  <div id="cats" class="chips"></div>

  <main id="main"></main>

  <footer class="foot">© <span id="yr"></span> Loopa · Live &amp; HD wallpapers</footer>
</div>

<nav class="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Explore</button>
  <button data-tab="live"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>Live</button>
  <button data-tab="favs"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Saved <em id="favCount">0</em></button>
</nav>

<div id="preview" class="preview" hidden>
  <div id="media" class="media"></div>
  <div id="spin" class="spin" hidden><div class="loader"></div></div>
  <div class="p-top">
    <button id="back" class="round" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
    <div class="p-actions">
      <button id="mute" class="round" aria-label="Mute" hidden></button>
      <button id="fav" class="round" aria-label="Save to favorites"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    </div>
  </div>
  <div class="p-bottom">
    <div class="p-meta"><span id="pType" class="tag"></span><span id="pCat" class="tag ghost"></span></div>
    <h2 id="pTitle" class="p-title"></h2>
    <p id="pErr" class="err" hidden>Video couldn't play — showing still image.</p>
    <button id="apply" class="btn primary"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>Apply Wallpaper</button>
  </div>

  <div id="sheet" class="sheet-bg" hidden>
    <div class="sheet">
      <div class="grab"></div>
      <div class="s-head"><h3>Set as wallpaper</h3><button id="closeSheet" class="x" aria-label="Close">&#10005;</button></div>
      <div class="opts">
        <button class="opt" data-where="Home screen"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H3z"/></svg>Home</button>
        <button class="opt" data-where="Lock screen"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Lock</button>
        <button class="opt" data-where="Both screens"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="2"/><rect x="13" y="4" width="8" height="16" rx="2"/></svg>Both</button>
      </div>
      <p class="note">Pick where you want it. We'll save the wallpaper, then your phone's own wallpaper screen finishes the job.</p>
      <a id="dl" class="btn ghost" download>Just download</a>
      <p id="msg" class="msg"></p>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
